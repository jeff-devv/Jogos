<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Charm Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="slot.css">
</head>
<body>
<div class="bg-glow"></div>
<div class="sparkles" id="sparkles"></div>

<div class="banner">DEMONSTRAÇÃO EDUCATIVA · créditos fictícios · sem dinheiro real e sem pagamentos</div>

<main class="game">
  <div class="lanterns"><span class="l1">🏮</span><span class="l2">🏮</span></div>

  <header class="title">
    <div class="crown">✦ ✦ ✦</div>
    <h1>LUCKY CHARM</h1>
    <div class="sub">FORTUNE DEMO</div>
  </header>

  <section class="cabinet" id="cabinet">
    <div class="leds top" id="ledsTop"></div>
    <div class="frame">
      <div class="reels" id="reels">
        <div class="reel"><div class="strip" id="strip0"></div></div>
        <div class="reel"><div class="strip" id="strip1"></div></div>
        <div class="reel"><div class="strip" id="strip2"></div></div>
        <div class="shade"></div>
        <div class="payline"><i></i><i></i></div>
      </div>
    </div>
    <div class="leds bottom" id="ledsBottom"></div>
  </section>

  <section class="display">
    <div class="box">
      <label>SALDO</label>
      <b id="balance">0,00</b>
    </div>
    <div class="box win-box">
      <label>GANHO</label>
      <b id="win">0,00</b>
    </div>
  </section>

  <section class="controls">
    <div class="bet-block">
      <label>APOSTA</label>
      <div class="betctl">
        <button id="betDown" aria-label="Diminuir aposta">−</button>
        <b id="bet">10</b>
        <button id="betUp" aria-label="Aumentar aposta">+</button>
      </div>
    </div>

    <button class="spin" id="spin" title="Girar (Espaço)" aria-label="Girar">
      <svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    </button>

    <div class="mode-block">
      <button class="toggle" id="turbo">⚡ Turbo</button>
      <button class="toggle" id="auto">↻ Auto</button>
    </div>
  </section>

  <p class="msg" id="msg">Aperte o botão verde ou a barra de espaço</p>

  <nav class="footer">
    <button class="link" id="sound">🔊 Som</button>
    <button class="link" id="paytable">🏆 Tabela de prêmios</button>
    <button class="link" id="reset">↺ Reiniciar saldo</button>
  </nav>
</main>

<div class="modal" id="modal"><div class="modal-body">
  <h2>Tabela de prêmios</h2>
  <p>Três símbolos iguais na mesma linha. A aposta é dividida em 3 linhas.</p>
  <ul id="paylist"></ul>
  <button id="closeModal">Fechar</button>
</div></div>

<div class="overlay" id="overlay"><div id="bigtext"></div><div id="bigamount"></div></div>

<script src="slot.js"></script>
</body>
</html>
