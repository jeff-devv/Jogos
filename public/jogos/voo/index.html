<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Charm · Voo da Joaninha</title>
<link rel="stylesheet" href="../../tema.css">
<link rel="stylesheet" href="voo.css">
</head>
<body>
<div class="banner">DEMONSTRAÇÃO EDUCATIVA · créditos fictícios · sem dinheiro real e sem pagamentos</div>

<main class="game">
  <header class="logo">
    <h1>LUCKY CHARM <small>VOO DA JOANINHA</small></h1>
  </header>

  <div class="userbar">
    <span id="hUser"></span>
    <a href="../../home.html">← Voltar aos jogos</a>
  </div>

  <p class="info">Toque ou aperte Espaço para a joaninha bater as asas e passar entre os pilares.</p>

  <section class="stats">
    <div class="box prize"><label>PONTOS</label><b id="score">0</b></div>
    <div class="box"><label>RECORDE</label><b id="best">0</b></div>
  </section>

  <section class="arena" id="arena">
    <canvas id="canvas"></canvas>
    <div class="arena-msg" id="msg"><p id="msgText">Toque ou aperte Espaço para voar</p></div>
  </section>

  <p class="result" id="result" aria-live="polite"></p>
  <button class="again" id="again" type="button" hidden>Jogar de novo</button>
</main>
<script src="../../sessao.js"></script>
<script src="voo.js"></script>
</body>
</html>
