<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Charm · Jokenpô</title>
<link rel="stylesheet" href="../../tema.css">
<link rel="stylesheet" href="jokenpo.css">
</head>
<body>
<div class="banner">DEMONSTRAÇÃO EDUCATIVA · créditos fictícios · sem dinheiro real e sem pagamentos</div>

<main class="game">
  <header class="logo">
    <h1>LUCKY CHARM <small>JOKENPÔ</small></h1>
  </header>

  <div class="userbar">
    <span id="hUser"></span>
    <a href="../../home.html">← Voltar aos jogos</a>
  </div>

  <p class="info">Pedra ganha da tesoura, tesoura ganha do papel e papel ganha da pedra. Vença várias seguidas!</p>

  <section class="stats">
    <div class="box prize"><label>VOCÊ</label><b id="wins">0</b></div>
    <div class="box"><label>CPU</label><b id="losses">0</b></div>
    <div class="box"><label>SEQUÊNCIA</label><b id="streak">0</b></div>
    <div class="box"><label>RECORDE</label><b id="best">0</b></div>
  </section>

  <section class="arena duel">
    <div class="side"><span>VOCÊ</span><b id="mine">❔</b></div>
    <div class="vs">×</div>
    <div class="side"><span>CPU</span><b id="cpu">❔</b></div>
  </section>
  <div class="choices" id="choices">
    <button class="choice" data-pick="pedra" type="button">✊<span>Pedra</span></button>
    <button class="choice" data-pick="papel" type="button">✋<span>Papel</span></button>
    <button class="choice" data-pick="tesoura" type="button">✌️<span>Tesoura</span></button>
  </div>

  <p class="result" id="result" aria-live="polite"></p>
  <button class="again" id="again" type="button" hidden>Jogar de novo</button>
</main>
<script src="../../sessao.js"></script>
<script src="jokenpo.js"></script>
</body>
</html>
