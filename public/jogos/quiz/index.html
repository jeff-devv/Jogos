<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Charm · Quiz</title>
<link rel="stylesheet" href="../../tema.css">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="banner">DEMONSTRAÇÃO EDUCATIVA · créditos fictícios · sem dinheiro real e sem pagamentos</div>

<main class="game">
  <header class="logo">
    <h1>LUCKY CHARM <small>QUIZ</small></h1>
  </header>

  <div class="userbar">
    <span id="hUser"></span>
    <a href="../../home.html">← Voltar aos jogos</a>
  </div>

  <p class="info">10 perguntas, 20 segundos cada. Acerto vale 10 pontos + bônus pela rapidez.</p>

  <section class="stats">
    <div class="box"><label>PERGUNTA</label><b id="round">1/10</b></div>
    <div class="box"><label>ACERTOS</label><b id="hits">0</b></div>
    <div class="box prize"><label>PONTOS</label><b id="score">0</b></div>
    <div class="box"><label>RECORDE</label><b id="best">0</b></div>
  </section>

  <section class="card" id="card">
    <div class="timer"><div class="timer-bar" id="timerBar"></div></div>
    <h2 class="question" id="question"></h2>
    <div class="options" id="options"></div>
  </section>

  <p class="result" id="result" aria-live="polite"></p>
  <button class="again" id="next" type="button" hidden>Próxima</button>
  <button class="again" id="again" type="button" hidden>Jogar de novo</button>
</main>
<script src="../../sessao.js"></script>
<script src="quiz.js"></script>
</body>
</html>
