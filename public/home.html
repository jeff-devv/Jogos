<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucky Charm · 20 Jogos</title>
  <link rel="stylesheet" href="styleHome.css">

  <style>
    .home {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffe9a6;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .hero {
      text-align: center;
      margin: 8px 0 16px;
    }

    .hero h2 {
      margin: 0;
      color: #ffd23f;
      letter-spacing: 3px;
      font-size: 28px;
    }

    .hero h2 span {
      display: inline-block;
      padding: 0 12px;
      border-radius: 12px;
      color: #4a0a06;
      background: linear-gradient(180deg, #fff6c8, #ffd23f 55%, #c8861a);
    }

    .hero p {
      margin: 6px 0 0;
      color: #ffe9a6;
      font-size: 14px;
    }

    .search {
      width: 100%;
      padding: 12px 16px;
      border-radius: 999px;
      border: 2px solid #ffd23f88;
      background: rgba(0, 0, 0, .35);
      color: #fff;
      font: inherit;
      font-size: 15px;
      outline: none;
    }

    .search:focus {
      border-color: #ffd23f;
    }

    .search::placeholder {
      color: #ffe9a6aa;
    }

    /* categorias: rolam na horizontal no celular */
    .chips-row {
      display: flex;
      gap: 8px;
      margin: 12px 0 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .cat {
      flex: none;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid #ffd23f66;
      background: rgba(0, 0, 0, .3);
      color: #ffe9a6;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .cat.on {
      background: #ffd23f;
      color: #4a0a06;
      border-color: #ffd23f;
    }

    /* grade de ícones, como num pacote de jogos */
    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 18px 12px;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 0;
      border: 0;
      background: none;
      color: #fff1b8;
      font: inherit;
      cursor: pointer;
    }

    .app .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 78px;
      height: 78px;
      border-radius: 22px;
      border: 2px solid #ffd23f;
      font-size: 40px;
      background: linear-gradient(160deg, #9a1a10, #3a0508);
      box-shadow: 0 6px 14px rgba(0, 0, 0, .45);
      transition: transform .15s, box-shadow .15s;
    }

    .app:hover .icon,
    .app:focus-visible .icon {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 12px 22px rgba(0, 0, 0, .5), 0 0 16px #ffd23f88;
    }

    /* cor do ícone pela categoria */
    .app[data-cat="acao"] .icon { background: linear-gradient(160deg, #ff7a1a, #8a2a00); }
    .app[data-cat="raciocinio"] .icon { background: linear-gradient(160deg, #3a7ad8, #102466); }
    .app[data-cat="cpu"] .icon { background: linear-gradient(160deg, #2aa04a, #0a4a18); }
    .app[data-cat="cassino"] .icon { background: linear-gradient(160deg, #c8202a, #3a0508); }

    .app .name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }

    .app .rec {
      font-size: 11px;
      color: #ffd23f;
      min-height: 13px;
    }

    .empty-msg {
      text-align: center;
      color: #ffe9a6;
      opacity: .8;
    }

    .banner {
      text-align: center;
      padding: 10px;
    }

    @media (max-width: 460px) {
      .apps {
        grid-template-columns: repeat(3, 1fr);
      }

      .app .icon {
        width: 68px;
        height: 68px;
        font-size: 34px;
        border-radius: 19px;
      }

      .hero h2 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <div class="banner">
    Jogos de demonstração. Sem aposta e sem dinheiro real.
  </div>

  <main class="home" id="home" hidden>
    <div class="topbar">
      <span id="hUser"></span>
      <button class="link" id="hLogout" type="button">Sair</button>
    </div>

    <div class="hero">
      <h2><span id="total">20</span> JOGOS</h2>
      <p>Tudo num lugar só. Escolha um e divirta-se!</p>
    </div>

    <input class="search" id="search" type="search" placeholder="🔍 Procurar jogo..." autocomplete="off">
    <div class="chips-row" id="cats"></div>

    <div class="apps" id="apps"></div>
    <p class="empty-msg" id="empty" hidden>Nenhum jogo encontrado.</p>
  </main>

  <script>
    const API = "api/";
    const token = localStorage.getItem("slot_token");

    // Caminho do Crash dentro do projeto no XAMPP.
    // Considera que home.html está na raiz do projeto.
    const CRASH_URL = "jogos/crash/public/index.html";

    const CATEGORIAS = [
      { id: "todos", label: "Todos" },
      { id: "acao", label: "⚡ Ação" },
      { id: "raciocinio", label: "🧩 Raciocínio" },
      { id: "cpu", label: "🤖 Contra a CPU" },
      { id: "cassino", label: "🎰 Cassino" },
    ];

    // record = chave usada pelo saveRecord() do jogo (sessao.js), para mostrar o recorde no ícone
    const JOGOS = [
      { icon: "🐍", title: "Cobrinha", cat: "acao", record: "cobrinha", href: "jogos/cobrinha/index.html" },
      { icon: "🔢", title: "Junta Blocos", cat: "raciocinio", record: "blocos", href: "jogos/blocos/index.html" },
      { icon: "💣", title: "Campo Minado", cat: "raciocinio", record: "minado", href: "jogos/minado/index.html" },
      { icon: "🧱", title: "Quebra-Tijolos", cat: "acao", record: "tijolos", href: "jogos/tijolos/index.html" },
      { icon: "🐞", title: "Voo da Joaninha", cat: "acao", record: "voo", href: "jogos/voo/index.html" },
      { icon: "🐸", title: "Corrida de Sapos", cat: "acao", record: "sapos", href: "jogos/sapos/index.html" },
      { icon: "❌", title: "Jogo da Velha", cat: "cpu", href: "jogos/velha/index.html" },
      { icon: "🟡", title: "Lig 4", cat: "cpu", href: "jogos/lig4/index.html" },
      { icon: "🏓", title: "Tênis de Mesa", cat: "cpu", record: "tenis", href: "jogos/tenis/index.html" },
      { icon: "✊", title: "Jokenpô", cat: "cpu", record: "jokenpo", href: "jogos/jokenpo/index.html" },
      { icon: "🐹", title: "Pega-Toupeira", cat: "acao", record: "toupeira", href: "jogos/toupeira/index.html" },
      { icon: "🎨", title: "Sequência de Cores", cat: "raciocinio", record: "sequencia", href: "jogos/sequencia/index.html" },
      { icon: "🧩", title: "Quebra-Cabeça", cat: "raciocinio", record: "deslize", href: "jogos/deslize/index.html" },
      { icon: "➕", title: "Contas Rápidas", cat: "raciocinio", record: "contas", href: "jogos/contas/index.html" },
      { icon: "🧠", title: "Memória", cat: "raciocinio", href: "jogos/memoria/index.html" },
      { icon: "❓", title: "Quiz", cat: "raciocinio", record: "quiz", href: "jogos/quiz/index.html" },
      { icon: "🔤", title: "Forca", cat: "raciocinio", record: "forca", href: "jogos/forca/index.html" },
      // login: mexem no saldo da conta, então só abrem para quem entrou
      { icon: "🎰", title: "Lucky Charm", cat: "cassino", href: "index.html?jogar", login: true },
      { icon: "🚀", title: "Crash", cat: "cassino", href: CRASH_URL, crash: true, login: true },
      { icon: "🎡", title: "Roleta", cat: "cassino", href: "jogos/roleta/index.html", login: true },
    ];

    const $ = (id) => document.getElementById(id);
    let categoria = "todos";
    let username = "visitante"; // mesma chave de recorde do sessao.js para quem não entrou
    let logged = false;

    // busca sem acento e sem diferença de maiúsculas ("memoria" acha "Memória")
    const plain = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

    function readRecord(game) {
      try {
        return Number(localStorage.getItem(`recorde_${game}_${username}`)) || 0;
      } catch (e) {
        return 0;
      }
    }

    function openGame(j) {
      if (j.login && !logged) {
        alert(`Entre na sua conta para jogar ${j.title}.`);
        window.location.href = "index.html";
        return;
      }

      if (j.crash) {
        const sessionToken = localStorage.getItem("slot_token");

        if (!sessionToken) {
          alert("Sua sessão expirou. Faça login novamente.");
          window.location.href = "index.html";
          return;
        }

        // Abre o Crash pelo Apache/XAMPP, mantendo
        // o token para a integração com a sessão.
        window.location.href = j.href + "#token=" + encodeURIComponent(sessionToken);
        return;
      }

      window.location.href = j.href;
    }

    function renderCats() {
      const box = $("cats");
      box.innerHTML = "";
      CATEGORIAS.forEach((c) => {
        const count = c.id === "todos" ? JOGOS.length : JOGOS.filter((j) => j.cat === c.id).length;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "cat" + (c.id === categoria ? " on" : "");
        b.textContent = `${c.label} (${count})`;
        b.addEventListener("click", () => {
          categoria = c.id;
          renderCats();
          renderApps();
        });
        box.appendChild(b);
      });
    }

    function renderApps() {
      const term = plain($("search").value.trim());
      const list = JOGOS.filter((j) =>
        (categoria === "todos" || j.cat === categoria) && plain(j.title).includes(term)
      );
      const box = $("apps");
      box.innerHTML = "";

      list.forEach((j) => {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "app";
        el.dataset.cat = j.cat;

        const icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = j.icon;

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = (j.login && !logged ? "🔒 " : "") + j.title;

        const rec = document.createElement("span");
        rec.className = "rec";
        const best = j.record ? readRecord(j.record) : 0;
        rec.textContent = best ? "🏆 " + best : "";

        el.append(icon, name, rec);
        el.addEventListener("click", () => openGame(j));
        box.appendChild(el);
      });

      $("empty").hidden = list.length > 0;
    }

    // o menu abre para todos; o login só libera os jogos com saldo (login: true)
    async function checkSession() {
      if (token) {
        try {
          const response = await fetch(API + "me.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ token })
          });

          if (response.status === 401) {
            localStorage.removeItem("slot_token");
          }

          if (!response.ok) {
            throw new Error("Sessão inválida");
          }

          const me = await response.json();
          username = me.username;
          logged = true;
        } catch (error) {
          // Sem sessão válida: continua como visitante.
        }
      }

      $("hUser").textContent = logged ? "Olá, " + username : "Olá, visitante";
      $("hLogout").textContent = logged ? "Sair" : "Entrar";
      $("total").textContent = JOGOS.length;
      renderCats();
      renderApps();
      $("home").hidden = false;
    }

    checkSession();

    $("search").addEventListener("input", renderApps);

    $("hLogout").addEventListener("click", async () => {
      if (!logged) {
        window.location.href = "index.html";
        return;
      }

      try {
        await fetch(API + "logout.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ token })
        });
      } catch (error) {
        // Encerra a sessão local mesmo se a API
        // estiver indisponível.
      }

      localStorage.removeItem("slot_token");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
